[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-dashboard"
version = "1.0.0"
description = "Command-line personal finance dashboard: SQLite-backed expense tracking, CSV ETL, budgets and Matplotlib reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aman Arora" }]
keywords = ["finance", "expenses", "budget", "sqlite", "matplotlib", "cli", "etl"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
expense = "expense_dashboard.cli:main"

[project.urls]
Repository = "https://github.com/Worldisbinary/expense-dashboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expense_dashboard = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["expense_dashboard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
]
ignore = [
    "RUF001", # the rupee sign and other unicode in strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PTH"]

[tool.ruff.format]
quote-style = "double"
